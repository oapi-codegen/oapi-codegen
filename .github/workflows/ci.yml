name: CI
on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    uses: oapi-codegen/actions/.github/workflows/ci.yml@d2230d7afd62cece3c85daa18cef7ce5e0a58ce6 # v0.9.3
    with:
      lint_versions: '["1.26"]'

  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        version:
          - "1.26"
          - "1.27"
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.version }}

      - name: Build
        run: go build ./cmd/oapi-codegen
        env:
          # A combination of our GitHub Actions setup, with the Go toolchain, leads to inconsistencies in calling `go env`, in particular with Go 1.21, where having (the default) `GOTOOLCHAIN=auto` results in build failures
          GOTOOLCHAIN: local
