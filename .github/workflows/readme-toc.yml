name: README TOC
on:
  push:
    paths:
      - README.md
      - .github/workflows/readme-toc.yml
  pull_request:
    paths:
      - README.md
      - .github/workflows/readme-toc.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  readme-toc-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Verify the README Table of Contents is up-to-date
        run: make readme-toc-check
