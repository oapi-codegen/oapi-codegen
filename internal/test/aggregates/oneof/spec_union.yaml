openapi: 3.0.0
info:
  title: Issue 970 Regression
  version: "1.0"
paths:
  /event:
    get:
      operationId: getEvent
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
  # From issue-2549: allOf member containing a oneOf union.
  /thing:
    get:
      operationId: getThing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thing'
  # From issue-2549: fixed properties alongside additionalProperties.
  /bag:
    get:
      operationId: getBag
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bag'
  # Control for #2549: top-level oneOf plus additionalProperties was already
  # delegated by the #970 fix.
  /both:
    get:
      operationId: getBoth
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Both'
  # Issue #2549 (inline variant): allOf+oneOf at the response root is hoisted
  # to a named body type and the envelope aliases it, so MarshalJSON is
  # inherited; the visitor must not bypass it by encoding `.union` directly.
  /inline-thing:
    get:
      operationId: getInlineThing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Base'
                  - oneOf:
                      - $ref: '#/components/schemas/Cat'
                      - $ref: '#/components/schemas/Dog'
  # Issue #2549 (x-go-type-name variant): the union model is moved to a renamed
  # type and this position becomes an alias to it, so the response envelope is
  # a defined type over the renamed model and still needs a delegator.
  /renamed:
    get:
      operationId: getRenamed
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenamedEvent'
components:
  schemas:
    RenamedEvent:
      x-go-type-name: EventImpl
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
    Event:
      oneOf:
        - $ref: '#/components/schemas/OnetimeEvent'
        - $ref: '#/components/schemas/RepeatableEvent'
    OnetimeEvent:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [onetime] }
        name: { type: string }
    RepeatableEvent:
      type: object
      required: [kind, interval]
      properties:
        kind: { type: string, enum: [repeatable] }
        interval: { type: string }
    # Issue #2549 schemas.
    Base:
      type: object
      required: [id]
      properties:
        id: { type: string }
    Thing:
      allOf:
        - $ref: '#/components/schemas/Base'
        - oneOf:
            - $ref: '#/components/schemas/Cat'
            - $ref: '#/components/schemas/Dog'
    Cat:
      type: object
      properties:
        meow: { type: string }
    Dog:
      type: object
      properties:
        woof: { type: string }
    Bag:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
      additionalProperties: true
    Both:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
      additionalProperties: true
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
