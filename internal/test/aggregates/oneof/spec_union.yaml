openapi: 3.0.0
info:
  title: Issue 970 Regression
  version: "1.0"
paths:
  /event:
    get:
      operationId: getEvent
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
  # From issue-2549: allOf member containing a oneOf union.
  /thing:
    get:
      operationId: getThing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thing'
  # From issue-2549: fixed properties alongside additionalProperties.
  /bag:
    get:
      operationId: getBag
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bag'
components:
  schemas:
    Event:
      oneOf:
        - $ref: '#/components/schemas/OnetimeEvent'
        - $ref: '#/components/schemas/RepeatableEvent'
    OnetimeEvent:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [onetime] }
        name: { type: string }
    RepeatableEvent:
      type: object
      required: [kind, interval]
      properties:
        kind: { type: string, enum: [repeatable] }
        interval: { type: string }
    Base:
      type: object
      required: [id]
      properties:
        id: { type: string }
    Thing:
      allOf:
        - $ref: '#/components/schemas/Base'
        - oneOf:
            - $ref: '#/components/schemas/Cat'
            - $ref: '#/components/schemas/Dog'
    Cat:
      type: object
      properties:
        meow: { type: string }
    Dog:
      type: object
      properties:
        woof: { type: string }
    Bag:
      type: object
      required: [kind]
      properties:
        kind: { type: string }
      additionalProperties: true
