versions: [v2, v3]
description: >-
  allOf over a $ref to a schema that x-go-type replaces, and a member with
  properties of its own.
subject:
  allOf:
    - $ref: '#/components/schemas/Typed'
    - type: object
      properties:
        kind: {type: string}
components:
  Typed:
    type: object
    required: [name]
    properties:
      name: {type: string}
    x-go-type: map[string]any
samples:
  - '{"name": "rex", "kind": "dog"}'
rejects:
  v3: "x-go-type replaces #/components/schemas/Typed with map[string]any"
