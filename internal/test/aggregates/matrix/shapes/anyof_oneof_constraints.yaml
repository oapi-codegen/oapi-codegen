versions: [v1, v2, v3]
description: >-
  An object with both an anyOf and a oneOf whose branches only add
  constraints (issue #839): at least one of a and b, and exactly one of c
  and d.
subject:
  type: object
  properties:
    a: {type: string}
    b: {type: string}
    c: {type: string}
    d: {type: string}
  anyOf:
    - required: [a]
    - required: [b]
  oneOf:
    - required: [c]
    - required: [d]
samples:
  - '{"a": "1", "c": "3"}'
  - '{"a": "1", "b": "2", "d": "4"}'
