versions: [v2, v3]
description: >-
  allOf over a $ref to a schema that declares a property next to an allOf of a
  oneOf. v2 generates a bare union, and keeps it one rather than add the
  property (#2571); v3 adds the property to the union.
subject:
  allOf:
    - $ref: '#/components/schemas/Mid'
    - description: A union with a property.
components:
  Mid:
    type: object
    properties:
      b: {type: string}
    allOf:
      - oneOf:
          - type: object
            required: [x]
            properties:
              x: {type: string}
          - type: object
            required: [y]
            properties:
              y: {type: integer}
samples:
  - '{"b": "x", "x": "s"}'
  - '{"y": 3}'
