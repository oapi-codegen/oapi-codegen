versions: [v1, v2, v3]
description: >-
  An object with a oneOf whose branches only add constraints: one of email or
  phone is required. They describe the object's valid values, not
  alternative types.
subject:
  type: object
  properties:
    email: {type: string}
    phone: {type: string}
  oneOf:
    - required: [email]
    - required: [phone]
samples:
  - '{"email": "a@example.com"}'
  - '{"phone": "555"}'
