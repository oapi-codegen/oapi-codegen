versions: [v1, v2, v3]
description: >-
  allOf over a single $ref to an untyped schema. The composition is the
  untyped schema's type. v1 used to embed it in a struct, which encoding/json
  encodes as a field named after the type ({"Untyped": ...}), and decoding the
  value itself failed (#2590).
subject:
  allOf:
    - $ref: '#/components/schemas/Untyped'
components:
  Untyped: {}
samples:
  - '"x"'
  - '{"k": "v"}'
  - '[1, "a"]'
