versions: [v1, v2, v3]
description: allOf over a $ref object schema and an inline object that adds properties.
subject:
  allOf:
    - $ref: '#/components/schemas/Named'
    - type: object
      required: [id]
      properties:
        id: {type: string}
        tags:
          type: array
          items: {type: string}
components:
  Named:
    type: object
    required: [name]
    properties:
      name: {type: string}
samples:
  - '{"name": "rex", "id": "1"}'
  - '{"name": "rex", "id": "1", "tags": ["a"]}'
