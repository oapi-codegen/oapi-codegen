versions: [v1, v2, v3]
description: >-
  allOf over a $ref to an untyped schema and a member with properties. The
  untyped member places no constraint and carries no value of its own, so the
  JSON is the object the other member describes. v1 keeps the embedded field,
  so code that sets it still compiles, but keeps it out of the JSON: it used
  to add a key named after the type ("Untyped") to every object (#2590).
subject:
  allOf:
    - $ref: '#/components/schemas/Untyped'
    - type: object
      required: [name]
      properties:
        name: {type: string}
components:
  Untyped: {}
samples:
  - '{"name": "rex"}'
