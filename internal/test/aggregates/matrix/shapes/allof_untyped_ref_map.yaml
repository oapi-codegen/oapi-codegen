versions: [v1, v2, v3]
description: >-
  allOf over a $ref to an untyped schema, a $ref to a map (an object with only
  additionalProperties) and an annotation. The untyped member places no
  constraint and carries no value of its own, so the composition is the map's
  type. v1 used to embed both members in a struct, which encodes the value
  under keys named after their types ({"Untyped": ..., "Labels": {...}}) and
  leaves the map empty on decoding (#2590).
subject:
  allOf:
    - $ref: '#/components/schemas/Untyped'
    - $ref: '#/components/schemas/Labels'
    - description: Labels, decorated.
components:
  Untyped: {}
  Labels:
    type: object
    additionalProperties: {type: string}
samples:
  - '{"k": "v", "l": "w"}'
  - '{}'
