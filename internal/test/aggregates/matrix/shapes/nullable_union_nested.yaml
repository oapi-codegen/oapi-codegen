versions: [v1, v2, v3]
description: >-
  An OpenAPI 3.1 nullable anyOf whose only other branch is an inline oneOf.
  Generated the union without its JSON methods or accessors, so a round trip
  dropped the payload (issue #2565).
openapi: 3.1.0
subject:
  anyOf:
    - oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
    - type: 'null'
components:
  Cat:
    type: object
    required: [meow]
    properties:
      meow: {type: string}
  Dog:
    type: object
    required: [bark]
    properties:
      bark: {type: string}
samples:
  - '{"meow": "purr"}'
  - '{"bark": "woof"}'
