versions: [v1, v2]
description: allOf over two $ref object schemas.
subject:
  allOf:
    - $ref: '#/components/schemas/Named'
    - $ref: '#/components/schemas/Aged'
components:
  Named:
    type: object
    required: [name]
    properties:
      name: {type: string}
  Aged:
    type: object
    required: [age]
    properties:
      age: {type: integer}
samples:
  - '{"name": "rex", "age": 3}'
