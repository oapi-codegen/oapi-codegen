versions: [v1, v2, v3]
description: >-
  allOf over two $refs to untyped schemas and an annotation. Neither member
  places a constraint, so the composition is untyped. v1 used to embed both in
  a struct, which encodes the value under keys named after their types
  ({"Untyped": ..., "Other": ...}) and cannot decode the value itself (#2590).
subject:
  allOf:
    - $ref: '#/components/schemas/Untyped'
    - $ref: '#/components/schemas/Other'
    - description: Untyped twice over.
components:
  Untyped: {}
  Other: {}
samples:
  - '"x"'
  - '{"k": "v"}'
  - '[1, "a"]'
