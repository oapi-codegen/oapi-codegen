versions: [v2, v3]
description: >-
  An OpenAPI 3.1 nullable anyOf whose only other branch is an inline schema
  with both a oneOf and an anyOf. In v3, From* of a variant replaces the keys
  its own union owns and keeps the other union's, as it does when the schema
  isn't wrapped (issue #2565).
openapi: 3.1.0
subject:
  anyOf:
    - oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      anyOf:
        - $ref: '#/components/schemas/Red'
        - $ref: '#/components/schemas/Blue'
    - type: 'null'
components:
  Cat:
    type: object
    required: [meow]
    properties:
      meow: {type: string}
  Dog:
    type: object
    required: [bark]
    properties:
      bark: {type: string}
  Red:
    type: object
    required: [red]
    properties:
      red: {type: string}
  Blue:
    type: object
    required: [blue]
    properties:
      blue: {type: string}
samples:
  - '{"meow": "purr", "red": "crimson"}'
  - '{"bark": "woof", "blue": "navy"}'
