# yaml-language-server: $schema=../../../../configuration-schema.json
package: optionsstructtagsunions
output: struct_tags_unions.gen.go
generate:
  models: true
output-options:
  skip-prune: true
  struct-tags:
    tags:
      # A key that depends on the field's flags: optional fields get a prefix.
      - name: json
        template: '{{if .IsOptional}}opt_{{end}}{{.FieldName}}_wire{{if .OmitEmpty}},omitempty{{end}}'
compatibility:
  schema-merging-behavior: v3
